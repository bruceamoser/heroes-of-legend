# Heroes of Legend combat engine - rule citations.
#
# Every constant, table and formula the engine implements is listed here with
# the chapter:line it must be readable at. `hol-engine audit` re-reads each
# chapter and fails if the text at the cited line no longer contains `text`.
#
# Do not change a `value` to make a test pass. Change it because the book
# changed, and change `text` with it.

citations:
  # ---------------------------------------------------------------- 06 core
  - id: core-roll
    source: "06:21"
    text: "3d6 + Attribute Modifier + Skill Bonus"
    value: "3d6 + attribute + skill (the DA adds a Boon or a Bane; no difficulty modifier)"
  - id: success-tier-weak
    source: "06:30"
    text: "[1-8], [*Weak*]"
    value: {name: Weak, min: 1, max: 8}

  - id: success-tier-standard
