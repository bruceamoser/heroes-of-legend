<svg xmlns="http://www.w3.org/2000/svg" width="540" height="245" viewBox="0 0 540 245"><rect width="100%" height="100%" fill="#f7f3e9"/><text x="270" y="28" font-family="serif" font-size="17" text-anchor="middle" fill="#28251c">FORCED MOVEMENT: APPLY EACH COST ONCE</text><rect x="12" y="52" width="112" height="145" rx="3" fill="#f7f3e9" stroke="#b39253" stroke-width="1.2"/><text x="68" y="88" font-family="serif" font-size="30" text-anchor="middle" fill="#28251c">5</text><text x="68" y="115" font-family="serif" font-size="12" text-anchor="middle" fill="#28251c">Printed push</text><text x="68" y="148" font-family="serif" font-size="11" text-anchor="middle" fill="#28251c">Target Stability 1</text><text x="68" y="172" font-family="serif" font-size="11" text-anchor="middle" fill="#28251c">5 − 1 = 4</text><text x="135" y="128" font-family="serif" font-size="22" text-anchor="middle" fill="#28251c">›</text><rect x="147" y="52" width="112" height="145" rx="3" fill="#f7f3e9" stroke="#b39253" stroke-width="1.2"/><text x="203" y="88" font-family="serif" font-size="30" text-anchor="middle" fill="#28251c">4</text><text x="203" y="115" font-family="serif" font-size="12" text-anchor="middle" fill="#28251c">Movement begins</text><text x="203" y="148" font-family="serif" font-size="11" text-anchor="middle" fill="#28251c">One normal square</text><text x="203" y="172" font-family="serif" font-size="11" text-anchor="middle" fill="#28251c">4 − 1 = 3</text><text x="270" y="128" font-family="serif" font-size="22" text-anchor="middle" fill="#28251c">›</text><rect x="282" y="52" width="112" height="145" rx="3" fill="#f7f3e9" stroke="#b39253" stroke-width="1.2"/><text x="338" y="88" font-family="serif" font-size="30" text-anchor="middle" fill="#28251c">3</text><text x="338" y="115" font-family="serif" font-size="12" text-anchor="middle" fill="#28251c">Contact</text><text x="338" y="148" font-family="serif" font-size="11" text-anchor="middle" fill="#28251c">Both take 3 damage*</text><text x="338" y="172" font-family="serif" font-size="11" text-anchor="middle" fill="#28251c">then Stability 2</text><text x="405" y="128" font-family="serif" font-size="22" text-anchor="middle" fill="#28251c">›</text><rect x="417" y="52" width="112" height="145" rx="3" fill="#f7f3e9" stroke="#b39253" stroke-width="1.2"/><text x="473" y="88" font-family="serif" font-size="30" text-anchor="middle" fill="#28251c">1</text><text x="473" y="115" font-family="serif" font-size="12" text-anchor="middle" fill="#28251c">Group continues</text><text x="473" y="148" font-family="serif" font-size="11" text-anchor="middle" fill="#28251c">3 − 2 = 1</text><text x="473" y="172" font-family="serif" font-size="11" text-anchor="middle" fill="#28251c">One square remains</text><text x="270" y="222" font-family="serif" font-size="12" text-anchor="middle" fill="#28251c">*Apply matching damage resistance. Stability reduces movement, not damage.</text></svg>